name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/memoir-api

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memoir
          POSTGRES_PASSWORD: memoir
          POSTGRES_DB: memoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoir -d memoir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://memoir:memoir@127.0.0.1:5432/memoir
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features --locked

  build:
    name: Build and push image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        name: Resolve immutable image tag
        run: echo "value=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      MEMOIR_PG_PASSWORD: ${{ secrets.MEMOIR_PG_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
      GHCR_TOKEN: ${{ github.token }}
      RELEASE_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Prepare deployment environment
        run: |
          install -d -m 700 .deploy
          umask 077
          {
            printf 'MEMOIR_PG_USER=memoir\n'
            printf 'MEMOIR_PG_PASSWORD=%s\n' "$MEMOIR_PG_PASSWORD"
            printf 'MEMOIR_PG_DB=memoir\n'
            printf 'MEMOIR_API_HOST_PORT=18080\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'RUST_LOG=info\n'
            printf 'LLM_API_BASE=%s\n' "$LLM_API_BASE"
            printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY"
            printf 'LLM_MODEL=%s\n' "$LLM_MODEL"
            printf 'WECHAT_APP_ID=%s\n' "$WECHAT_APP_ID"
            printf 'WECHAT_APP_SECRET=%s\n' "$WECHAT_APP_SECRET"
          } > .deploy/runtime.env
          printf 'MEMOIR_API_IMAGE=%s\n' "$RELEASE_IMAGE" > .deploy/release.env
      - name: Upload deployment files
        run: |
          ssh "$SSH_USER@$SSH_HOST" "install -d -m 700 /opt/memoir/deploy"
          scp deploy/docker-compose.yml deploy/deploy.sh "$SSH_USER@$SSH_HOST:/opt/memoir/deploy/"
          scp .deploy/runtime.env "$SSH_USER@$SSH_HOST:/opt/memoir/deploy/.env.next"
          scp .deploy/release.env "$SSH_USER@$SSH_HOST:/opt/memoir/deploy/.release.env.next"
      - name: Pull and deploy immutable image
        run: |
          printf '%s' "$GHCR_TOKEN" |
            ssh "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh "$SSH_USER@$SSH_HOST" '
            set -e
            cd /opt/memoir/deploy
            chmod 700 deploy.sh
            chmod 600 .env.next .release.env.next
            mv .env.next .env
            ./deploy.sh
          '
      - name: Verify public API
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://api.wangshun.work/health
