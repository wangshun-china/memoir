name: CI and deploy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_env:
        description: Deployment target
        required: true
        default: aliyun
        type: choice
        options:
          - aliyun
          - wsl

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/memoir-api
  ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ACR_IMAGE_NAME: ${{ vars.MEMOIR_ACR_IMAGE_NAME || 'wangshun_build/memoir-api' }}

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memoir
          POSTGRES_PASSWORD: memoir
          POSTGRES_DB: memoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoir -d memoir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://memoir:memoir@127.0.0.1:5432/memoir
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features --locked

  build:
    name: Build and push image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.image.outputs.ghcr }}
      acr_image: ${{ steps.image.outputs.acr }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ vars.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - id: image
        name: Resolve immutable image tags
        run: |
          echo "ghcr=${GHCR_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "acr=${ACR_REGISTRY}/${ACR_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ghcr }}
            ${{ env.GHCR_IMAGE_NAME }}:latest
            ${{ steps.image.outputs.acr }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.event.inputs.target_env }}
    if: github.event_name == 'workflow_dispatch' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: [self-hosted, "${{ github.event.inputs.target_env }}"]
    environment: production
    env:
      MEMOIR_PG_PASSWORD: ${{ secrets.MEMOIR_PG_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
      GHCR_TOKEN: ${{ github.token }}
      ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      RELEASE_GHCR_IMAGE: ${{ needs.build.outputs.ghcr_image }}
      RELEASE_ACR_IMAGE: ${{ needs.build.outputs.acr_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment environment
        run: |
          install -d -m 700 .deploy
          umask 077
          {
            printf 'MEMOIR_PG_USER=memoir\n'
            printf 'MEMOIR_PG_PASSWORD=%s\n' "$MEMOIR_PG_PASSWORD"
            printf 'MEMOIR_PG_DB=memoir\n'
            printf 'MEMOIR_API_BIND_HOST=172.17.0.1\n'
            printf 'MEMOIR_API_HOST_PORT=18080\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'RUST_LOG=info\n'
            printf 'LLM_API_BASE=%s\n' "$LLM_API_BASE"
            printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY"
            printf 'LLM_MODEL=%s\n' "$LLM_MODEL"
            printf 'WECHAT_APP_ID=%s\n' "$WECHAT_APP_ID"
            printf 'WECHAT_APP_SECRET=%s\n' "$WECHAT_APP_SECRET"
          } > .deploy/runtime.env
      - name: Install deployment files
        run: |
          install -d -m 700 /opt/memoir/deploy
          install -m 644 deploy/docker-compose.yml /opt/memoir/deploy/docker-compose.yml
          install -m 700 deploy/deploy.sh /opt/memoir/deploy/deploy.sh
          install -m 600 .deploy/runtime.env /opt/memoir/deploy/.env.next
      - name: Resolve and deploy immutable image
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$ACR_PASSWORD" |
            docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin

          if docker pull "$RELEASE_GHCR_IMAGE"; then
            RELEASE_IMAGE="$RELEASE_GHCR_IMAGE"
          elif docker pull "$RELEASE_ACR_IMAGE"; then
            echo "GHCR pull failed; using Aliyun ACR fallback."
            RELEASE_IMAGE="$RELEASE_ACR_IMAGE"
          else
            echo "Unable to pull the release image from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          umask 077
          printf 'MEMOIR_API_IMAGE=%s\n' "$RELEASE_IMAGE" > /opt/memoir/deploy/.release.env.next
          cd /opt/memoir/deploy
          mv .env.next .env
          ./deploy.sh
      - name: Verify public API
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
            http://api.wangshun.work/health |
            grep -q '"service":"memoir-server"'
