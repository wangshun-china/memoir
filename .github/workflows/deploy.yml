name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Deployment target
        required: true
        default: aliyun
        type: choice
        options:
          - aliyun
          - wsl

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.repository }}-${{ github.event.inputs.target_env }}
  cancel-in-progress: false

env:
  GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/memoir-api
  ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ACR_IMAGE_NAME: ${{ vars.MEMOIR_ACR_IMAGE_NAME || 'wangshun_build/memoir-api' }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.image.outputs.ghcr }}
      acr_image: ${{ steps.image.outputs.acr }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate build configuration
        env:
          ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          set -euo pipefail
          required=(ACR_REGISTRY ACR_IMAGE_NAME ACR_USERNAME ACR_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions configuration: ${name}"
              exit 1
            fi
          done
          test -f server/Dockerfile || {
            echo "::error::Dockerfile not found: server/Dockerfile"
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ vars.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - id: image
        name: Resolve immutable image tags
        run: |
          echo "ghcr=${GHCR_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "acr=${ACR_REGISTRY}/${ACR_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push image to both registries
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ghcr }}
            ${{ env.GHCR_IMAGE_NAME }}:latest
            ${{ steps.image.outputs.acr }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.event.inputs.target_env }}
    needs: build-and-push
    runs-on: [self-hosted, "${{ github.event.inputs.target_env }}"]
    environment: ${{ github.event.inputs.target_env }}
    permissions:
      contents: read
      packages: read
    env:
      MEMOIR_PG_PASSWORD: ${{ secrets.MEMOIR_PG_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_RECOVERY_SECRET: ${{ secrets.ADMIN_RECOVERY_SECRET }}
      LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_ENABLE_THINKING: ${{ vars.LLM_ENABLE_THINKING || '1' }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
      GHCR_TOKEN: ${{ github.token }}
      ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      RELEASE_GHCR_IMAGE: ${{ needs.build-and-push.outputs.ghcr_image }}
      RELEASE_ACR_IMAGE: ${{ needs.build-and-push.outputs.acr_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          required=(MEMOIR_PG_PASSWORD JWT_SECRET ACR_REGISTRY ACR_USERNAME ACR_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions configuration: ${name}"
              exit 1
            fi
          done
      - name: Prepare deployment environment
        run: |
          install -d -m 700 .deploy
          umask 077
          {
            printf 'MEMOIR_PG_USER=memoir\n'
            printf 'MEMOIR_PG_PASSWORD=%s\n' "$MEMOIR_PG_PASSWORD"
            printf 'MEMOIR_PG_DB=memoir\n'
            printf 'MEMOIR_API_BIND_HOST=172.17.0.1\n'
            printf 'MEMOIR_API_HOST_PORT=18080\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'ADMIN_RECOVERY_SECRET=%s\n' "$ADMIN_RECOVERY_SECRET"
            printf 'RUST_LOG=info\n'
            printf 'LLM_API_BASE=%s\n' "$LLM_API_BASE"
            printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY"
            printf 'LLM_MODEL=%s\n' "$LLM_MODEL"
            printf 'LLM_ENABLE_THINKING=%s\n' "$LLM_ENABLE_THINKING"
            printf 'WECHAT_APP_ID=%s\n' "$WECHAT_APP_ID"
            printf 'WECHAT_APP_SECRET=%s\n' "$WECHAT_APP_SECRET"
          } > .deploy/runtime.env
      - name: Install deployment files
        run: |
          install -d -m 700 /opt/memoir/deploy
          install -m 644 deploy/docker-compose.yml /opt/memoir/deploy/docker-compose.yml
          install -m 700 deploy/deploy.sh /opt/memoir/deploy/deploy.sh
          install -m 600 .deploy/runtime.env /opt/memoir/deploy/.env.next
      - name: Deploy with GHCR primary and Aliyun ACR fallback
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$ACR_PASSWORD" |
            docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin

          if docker pull "$RELEASE_GHCR_IMAGE"; then
            RELEASE_IMAGE="$RELEASE_GHCR_IMAGE"
          elif docker pull "$RELEASE_ACR_IMAGE"; then
            echo "GHCR pull failed; using Aliyun ACR fallback."
            RELEASE_IMAGE="$RELEASE_ACR_IMAGE"
          else
            echo "Unable to pull the release image from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          umask 077
          printf 'MEMOIR_API_IMAGE=%s\n' "$RELEASE_IMAGE" > /opt/memoir/deploy/.release.env.next
          cd /opt/memoir/deploy
          mv .env.next .env
          ./deploy.sh
      - name: Verify deployment
        run: |
          if [[ "${{ github.event.inputs.target_env }}" == "aliyun" ]]; then
            HEALTH_URL="https://api.wangshun.work/health"
          else
            HEALTH_URL="http://172.17.0.1:18080/health"
          fi
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$HEALTH_URL" |
            grep -q '"service":"memoir-server"'
      - name: Clean old memoir images
        shell: bash
        run: |
          set -euo pipefail

          current_ref="$(docker inspect memoir-api --format '{{.Config.Image}}')"
          ghcr_repository="${RELEASE_GHCR_IMAGE%:*}"
          acr_repository="${RELEASE_ACR_IMAGE%:*}"

          cleanup_repository_images() {
            local repository="$1"
            local stale_refs=()

            mapfile -t stale_refs < <(
              docker image ls "$repository" --format '{{.Repository}}:{{.Tag}}' |
                grep -Fvx "$current_ref" |
                grep -v ':<none>$' |
                sort -u || true
            )

            if (( ${#stale_refs[@]} > 0 )); then
              printf 'Removing old memoir images from %s:\n' "$repository"
              printf '  %s\n' "${stale_refs[@]}"
              docker image rm -f "${stale_refs[@]}"
            fi
          }

          cleanup_repository_images "$ghcr_repository"
          cleanup_repository_images "$acr_repository"
          docker image prune -f \
            --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"
