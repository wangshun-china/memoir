name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memoir
          POSTGRES_PASSWORD: memoir
          POSTGRES_DB: memoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoir -d memoir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://memoir:memoir@127.0.0.1:5432/memoir
      JWT_SECRET: ci-only-jwt-secret
      ALLOW_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: |
          # CI service is ephemeral; still use a dedicated test DB name for clarity.
          PGPASSWORD=memoir psql -h 127.0.0.1 -U memoir -d memoir -c "SELECT 1" >/dev/null
          PGPASSWORD=memoir psql -h 127.0.0.1 -U memoir -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='memoir_test'" | grep -q 1 \
            || PGPASSWORD=memoir psql -h 127.0.0.1 -U memoir -d postgres -c "CREATE DATABASE memoir_test OWNER memoir;"
          DATABASE_URL=postgres://memoir:memoir@127.0.0.1:5432/memoir_test \
          TEST_DATABASE_URL=postgres://memoir:memoir@127.0.0.1:5432/memoir_test \
            cargo test --all-targets --all-features --locked

  miniprogram-helpers:
    name: Miniprogram pure helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: verify_goal_helpers
        run: node scripts/verify_goal_helpers.mjs
