# 挂到现有 wangshun-portfolio nginx 的 conf.d（或等价网关）。
# 模式与 ai-coder / api_transfer 一致：server_name → host.docker.internal:宿主机端口
#
# 合并后 reload:
#   docker exec wangshun-portfolio nginx -t && docker exec wangshun-portfolio nginx -s reload

server {
    listen 80;
    server_name api.wangshun.work;

    client_max_body_size 10m;

    location / {
        proxy_pass http://host.docker.internal:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
